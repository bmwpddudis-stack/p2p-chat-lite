<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>P2P Чат: Ник вместо ID</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>P2P Чат</h2>

  <!-- Лобби -->
  <div id="lobby">
    <p>Статус: <span id="lobby-status">Инициализация…</span></p>

    <label><b>Придумайте ник:</b></label><br>
    <input id="user-nick" placeholder="Например: Макс" style="width:100%;box-sizing:border-box;margin-bottom:10px;" />

    <button id="copy-invite-link">Скопировать ссылку для приглашения</button>
    <hr />
    <p>Чтобы начать чат, отправьте ссылку другу. Он сразу подключится к вам.</p>
  </div>

  <!-- Чат -->
  <div id="chat-view" style="display:none;">
    <div id="messages"></div>
    <div class="input-area">
      <input id="text-input" type="text" placeholder="Сообщение" />
      <button id="send-btn">➤</button>
      <label class="file-label">📷 <input type="file" id="image-input" accept="image/*" /></label>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
